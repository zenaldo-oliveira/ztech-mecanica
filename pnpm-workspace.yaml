packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 bloqueia scripts de instalação por padrão. Mantidas as escolhas que já
# existiam em apps/frontend/pnpm-workspace.yaml.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Dependências autorizadas a executar scripts de instalação.
onlyBuiltDependencies:
  - esbuild
